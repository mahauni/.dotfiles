# Enable mouse
set -g mouse on

# Enable Truecolors to the tmux
set-option -ga terminal-features 'xterm-256color:RGB'

# Enable OSC 52 clipboard passthrough for tmux-256color
set-option -ga terminal-features 'tmux-256color:clipboard'

# Extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Start at 1
set -g base-index 1
setw -g pane-base-index 1

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g set-clipboard on
set -g allow-passthrough on

setw -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# Enable auto ressurect of tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set -g status-right '%Y-%m-%d %H:%M #{tmux_mode_indicator}'

run '~/.tmux/plugins/tpm/tpm'

# agent-notify: mantém as flags (* e -) e o espaçamento padrão das janelas.
set -g window-status-format '#I:#W#{E:@agent_notify_indicator}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#W#{E:@agent_notify_indicator}#{?window_flags,#{window_flags}, }'
